name: Build and Package .dapp

on:
  push:
    branches:
      - mainnet
      - workflow-test
  pull_request:
    branches:
      - mainnet
      - workflow-test

jobs:
  build:
    uses: BeamMW/beam-asset-minter-app/.github/workflows/make-dapp.yaml@9-add-automatic-build-workflow
